name: Pawquanta Core development builds
on:
  push:
    branches: [core-development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: linux-core-v30.2-${{ github.sha }}
          restore-keys: linux-core-v30.2-
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ ccache libboost-dev libevent-dev libsqlite3-dev
      - name: Configure
        run: cmake -S core -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache -DENABLE_IPC=OFF -DBUILD_GUI=OFF -DBUILD_TESTS=ON -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF -DENABLE_WALLET=ON
      - name: Compile
        run: cmake --build build -j4
      - name: Issuance and network identity tests
        run: build/bin/test_bitcoin --run_test=validation_tests --log_level=test_suite
      - name: Miner accounting tests
        run: python -m unittest test_core_miner -v
      - name: Two-node and separate-miner acceptance
        run: python core-tools/verify-core-live.py --binary build/bin/bitcoind --report reports/core-live-linux.json
      - name: Package development binaries
        run: |
          mkdir -p package/linux/bin package/linux/lib
          cp build/bin/bitcoind package/linux/bin/pawquanta-node
          cp build/bin/bitcoin-cli package/linux/bin/pawquanta-cli
          cp core/COPYING CORE-CHANGELOG.md package/linux/
          for binary in build/bin/bitcoind build/bin/bitcoin-cli; do
            ldd "$binary" | awk '/=> \/.*(libevent|libsqlite)/ {print $3}' | xargs -r -I '{}' cp -L '{}' package/linux/lib/
          done
          sha256sum package/linux/bin/* > package/linux/SHA256SUMS
          tar -C package -czf Pawquanta-Core-Linux-development.tar.gz linux
      - name: Full upstream unit suite with network delta
        run: build/bin/test_bitcoin --log_level=error --report_level=detailed > reports/core-unit-linux.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-linux-development
          path: |
            Pawquanta-Core-Linux-development.tar.gz
            reports/*.json
            reports/*.txt
          if-no-files-found: warn
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare dependency cache
        run: New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - uses: actions/cache@v4
        with:
          path: vcpkg-binary-cache
          key: windows-core-vcpkg-${{ hashFiles('core/vcpkg.json') }}
      - name: Configure static runtime and dependencies
        working-directory: core
        run: cmake -B ../build --preset vs2022-static -DBUILD_GUI=OFF -DENABLE_IPC=OFF -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON '-DVCPKG_MANIFEST_FEATURES=wallet;tests' '-DVCPKG_INSTALL_OPTIONS=--x-buildtrees-root=C:\pqua-vcpkg'
      - name: Compile
        run: cmake --build build --config Release -j4
      - name: Issuance and network identity tests
        run: build/bin/Release/test_bitcoin.exe --run_test=validation_tests --log_level=test_suite
      - name: Miner accounting tests
        run: python -m unittest test_core_miner -v
      - name: Two-node and separate-miner acceptance
        run: python core-tools/verify-core-live.py --binary build/bin/Release/bitcoind.exe --report reports/core-live-windows.json
      - name: Package development binaries
        run: |
          New-Item -ItemType Directory -Force package/windows | Out-Null
          Copy-Item build/bin/Release/bitcoind.exe package/windows/Pawquanta-node.exe
          Copy-Item build/bin/Release/bitcoin-cli.exe package/windows/Pawquanta-cli.exe
          Copy-Item core/COPYING,CORE-CHANGELOG.md package/windows/
          Get-FileHash package/windows/*.exe | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content package/windows/SHA256SUMS
          Compress-Archive -Path package/windows -DestinationPath Pawquanta-Core-Windows-development.zip
      - name: Full upstream unit suite with network delta
        shell: cmd
        run: build\bin\Release\test_bitcoin.exe --log_level=error --report_level=detailed > reports\core-unit-windows.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-windows-development
          path: |
            Pawquanta-Core-Windows-development.zip
            reports/*.json
            reports/*.txt
          if-no-files-found: warn
